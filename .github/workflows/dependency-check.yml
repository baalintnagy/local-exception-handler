name: Dependency Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-check:
    runs-on: ubuntu-latest
    env:
      DEPENDENCY_CHECK_VERSION: '13.0.0'
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
      DEPENDENCY_CHECK_DATA: ${{ runner.temp }}/dependency-check-data
    steps:
      - uses: actions/checkout@v5

      - name: Require an NVD API key
        shell: bash
        run: |
          if [ -z "$NVD_API_KEY" ]; then
            echo '::error::Configure the NVD_API_KEY repository secret before running this scan.'
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: temurin
          cache: maven

      - name: Restore vulnerability database
        uses: actions/cache@v4
        with:
          path: ${{ env.DEPENDENCY_CHECK_DATA }}
          key: nvd-${{ runner.os }}-${{ env.DEPENDENCY_CHECK_VERSION }}-${{ github.run_id }}
          restore-keys: |
            nvd-${{ runner.os }}-${{ env.DEPENDENCY_CHECK_VERSION }}-

      - name: Run dependency check
        shell: bash
        run: |
          mvn -B "org.owasp:dependency-check-maven:${DEPENDENCY_CHECK_VERSION}:check" \
            -DnvdApiKeyEnvironmentVariable=NVD_API_KEY \
            "-DdataDirectory=${DEPENDENCY_CHECK_DATA}"
